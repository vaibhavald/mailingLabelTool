<!DOCTYPE html>
<html>
<head>
  <title>Google People API Contacts</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Client ID from the Google API Console
    var CLIENT_ID = '509563891606-7e8onpesfmdop1ne2mc2enhm76nbqqhi.apps.googleusercontent.com';

    // Array to store contact names
    var contactNames = [];

    // Load the Google Sign-In API client and initialize
    function loadGoogleSignIn() {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse
      });
    }

    // Handle the user's credential response
    function handleCredentialResponse(response) {
      if (response.credential) {
        var credential = response.credential;

        // Request contacts using the access token
        gapi.load('client', function () {
          gapi.client.init({
            apiKey: 'AIzaSyCwgToPvB9luZ0poJ0cDZLArydQM_zGQdI',
            clientId: CLIENT_ID,
            discoveryDocs: ['https://people.googleapis.com/$discovery/rest?version=v1'],
            scope: 'https://www.googleapis.com/auth/contacts.readonly'
          }).then(function () {
            gapi.auth.setToken({
              access_token: credential
            });

            // API request to get contacts
            gapi.client.people.people.connections.list({
              resourceName: 'people/me',
              pageSize: 10,
              personFields: 'names'
            }).then(function (response) {
              var connections = response.result.connections;
              if (connections && connections.length > 0) {
                for (var i = 0; i < connections.length; i++) {
                  var contact = connections[i];
                  var names = contact.names;
                  if (names && names.length > 0) {
                    var name = names[0].displayName;
                    contactNames.push(name);
                  }
                }
                populateDropdown();
              } else {
                console.log('No contacts found.');
              }
            }, function (error) {
              console.error('Error loading contacts:', error);
            });
          });
        });
      }
    }

    // Populate the dropdown with contact names
    function populateDropdown() {
      var dropdown = document.getElementById('contactDropdown');
      for (var i = 0; i < contactNames.length; i++) {
        var option = document.createElement('option');
        option.value = contactNames[i];
        option.text = contactNames[i];
        dropdown.appendChild(option);
      }
    }
  </script>
</head>
<body>
  <h1>Google People API Contacts</h1>
  <div id="g_id_onload"
       data-client_id="YOUR_CLIENT_ID"
       data-callback="handleCredentialResponse"
       data-auto_select="true"></div>
  <select id="contactDropdown"></select>
  <script src="https://apis.google.com/js/platform.js?onload=loadGoogleSignIn" async defer></script>
</body>
</html>
