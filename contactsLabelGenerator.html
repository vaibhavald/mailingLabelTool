<!DOCTYPE html>
<html>

<head>
    <title>Google Contacts Dropdown</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        var API_KEY = "AIzaSyCwgToPvB9luZ0poJ0cDZLArydQM_zGQdI";
        var CLIENT_ID = "509563891606-7e8onpesfmdop1ne2mc2enhm76nbqqhi.apps.googleusercontent.com";
    </script>
</head>

<body>
    <h1>Google Contacts Dropdown</h1>
    <select id="contacts">
    </select>
    <script>
        // Get the Google Contacts API client.
        var contacts = new google.contacts.Contacts();

        // Get the list of contacts.
        contacts.list().then(function (contacts) {
            // Iterate over the contacts and add them to the dropdown.
            for (var i = 0; i < contacts.length; i++) {
                var contact = contacts[i];
                var option = document.createElement("option");
                option.value = contact.name;
                option.text = contact.name;
                document.getElementById("contacts").appendChild(option);
            }
        });
    </script>
</body>

</html>
