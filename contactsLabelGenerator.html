<!DOCTYPE html>
<html>
<head>
  <title>Google Contacts Search</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Client ID and API key from the Google Cloud Console
    var clientId = '509563891606-7e8onpesfmdop1ne2mc2enhm76nbqqhi.apps.googleusercontent.com';
    var apiKey = 'AIzaSyCwgToPvB9luZ0poJ0cDZLArydQM_zGQdI';
    // Initialize the Google Sign-In button
    function init() {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleAuthResult
      });
      google.accounts.id.renderButton(
        document.getElementById('authorizeButton'),
        { theme: 'filled_black', size: 'large', type: 'standard' }
      );
    }

    // Handle the authentication result
    function handleAuthResult(response) {
      if (response.status.id_token) {
        // Authorization successful, retrieve contacts
        loadContacts(response.status.id_token);
      } else {
        // Authorization failed
        console.error('Authentication failed:', response.error);
      }
    }

    // Load and display the contacts in the dropdown
    function loadContacts(idToken) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://people.googleapis.com/v1/people/me/connections?personFields=names');
      xhr.setRequestHeader('Authorization', 'Bearer ' + idToken);
      xhr.setRequestHeader('X-Goog-Api-Key', apiKey);
      xhr.onload = function () {
        if (xhr.status === 200) {
          var response = JSON.parse(xhr.responseText);
          var contacts = response.connections;
          var select = document.getElementById('contactSearch');

          contacts.forEach(function (contact) {
            var option = document.createElement('option');
            option.value = contact.resourceName;
            option.text = contact.names[0].displayName;
            select.appendChild(option);
          });
        } else {
          console.error('Error loading contacts:', xhr.statusText);
        }
      };
      xhr.send();
    }

    // Handle the selected contact from the dropdown
    function handleContactSelection() {
      var selectedContact = document.getElementById('contactSearch').value;
      if (selectedContact) {
        console.log('Selected contact:', selectedContact);
        // You can perform further actions with the selected contact here
      }
    }
  </script>
</head>
<body>
  <h1>Google Contacts Search</h1>

  <label for="contactSearch">Search for a contact:</label>
  <select id="contactSearch">
    <option value="">Select a contact</option>
  </select>

  <div id="authorizeButton"></div>

  <script>
    // Call the function to initialize the Google Sign-In button
    init();
  </script>
</body>
</html>
