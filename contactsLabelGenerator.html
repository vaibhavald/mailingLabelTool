<!DOCTYPE html>
<html>
<head>
  <title>Google Contacts Search</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    // Client ID and API key from the Google Cloud Console
    var clientId = '509563891606-7e8onpesfmdop1ne2mc2enhm76nbqqhi.apps.googleusercontent.com';
    var apiKey = 'AIzaSyCwgToPvB9luZ0poJ0cDZLArydQM_zGQdI';

    // Authorization scopes required for accessing contacts
    var scopes = 'https://www.googleapis.com/auth/contacts.readonly';

    // Handle the authentication flow
    function handleClientLoad() {
      gapi.load('client:auth2', initClient);
    }

    // Initialize the client with OAuth 2.0 settings
    function initClient() {
      gapi.client.init({
        apiKey: apiKey,
        clientId: clientId,
        discoveryDocs: ['https://people.googleapis.com/$discovery/rest?version=v1'],
        scope: scopes
      }).then(function () {
        authorizeButton.onclick = handleAuthClick;
        loadContacts();
      });
    }

    // Handle the authentication button click event
    function handleAuthClick(event) {
      gapi.auth2.getAuthInstance().signIn().then(function () {
        loadContacts();
      });
    }

    // Load and display the contacts in the dropdown
    function loadContacts() {
      gapi.client.people.people.connections.list({
        resourceName: 'people/me',
        pageSize: 1000,
        personFields: 'names'
      }).then(function (response) {
        var contacts = response.result.connections;
        var select = document.getElementById('contactSearch');

        contacts.forEach(function (contact) {
          var option = document.createElement('option');
          option.value = contact.resourceName;
          option.text = contact.names[0].displayName;
          select.appendChild(option);
        });
      }).catch(function (error) {
        console.error('Error loading contacts:', error);
      });
    }

    // Handle the selected contact from the dropdown
    function handleContactSelection() {
      var selectedContact = document.getElementById('contactSearch').value;
      if (selectedContact) {
        console.log('Selected contact:', selectedContact);
        // You can perform further actions with the selected contact here
      }
    }
  </script>
</head>
<body>
  <h1>Google Contacts Search</h1>

  <label for="contactSearch">Search for a contact:</label>
  <select id="contactSearch">
    <option value="">Select a contact</option>
  </select>

  <button id="authorizeButton" style="display: none;">Authorize</button>

  <script>
    // Call the function to handle the client load
    handleClientLoad();
  </script>
</body>
</html>
