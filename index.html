<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mailing Label Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            color: #333;
            margin: 30px 0;
        }

        form {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        textarea {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #666;
        }

        #label_container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            page-break-inside: avoid;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            vertical-align: top;
            border-radius: 10%;
        }

        @media only screen and (max-width: 768px) {
            form {
                padding: 20px;
            }

            textarea {
                margin-bottom: 10px;
            }
        }

        @media only screen and (max-width: 480px) {
            h1 {
                font-size: 28px;
                margin: 20px 0;
            }

            form {
                padding: 10px;
            }

            textarea {
                margin-bottom: 5px;
                font-size: 14px;
            }

            button {
                font-size: 16px;
            }

            #label_container {
                padding: 10px;
            }

            td {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <h1>Mailing Label Generator</h1>
    <form>
        <label for="from_address">From:</label>
        <textarea id="from_address" name="from_address"
            rows="3">Udai Srivastava<br>Kumud Cottage, 503K/1R, Rajroopur<br>Prayagraj-211011, Mobile: +91-9415267861</textarea>
        <br>
        <label for="to_addresses">To:</label>
        <textarea id="to_addresses" name="to_addresses" rows="10"></textarea>
        <br>
        <button type="button" onclick="generateLabels()">Generate Labels</button>
        <button type="button" onclick="printLabels()">Print Labels</button>
    </form>
    <br>
    <div id="label_container"></div>
    <script>

        function generateLabels() {
            // Get form inputs
            var fromAddress = document.getElementById('from_address').value;
            var toAddresses = document.getElementById('to_addresses').value;
            var addresses = toAddresses.split('\n\n');

            // Define mailing label template
            var labelTemplate = `
        <table style="border-collapse: collapse; width: 100%; page-break-inside: avoid;">
            <tr>
                <td style="text-align: center; font-size: 20px; font-weight: bold; border: 1px solid black; padding: 10px;">Vaibhav Law House</td>
            </tr>
            <tr>
                <td style="border: 1px solid black; padding: 10px;">
                    <div style="font-weight: bold;">Deliver To:</div>
                    <div>{{line1}}</div>
                    <div>{{line2}}</div>
                    <div>{{line3}}</div>
                    <div>{{line4}}</div>
                    <br>
                    <div style="font-weight: bold; text-align: right;">If undelivered return to:</div>
                    <div style="text-align: right;">${fromAddress}</div>
                </td>
            </tr>
        </table>
    `;

            // Generate mailing labels and display them
            var labelContainer = document.getElementById('label_container');
            labelContainer.innerHTML = '';
            addresses.forEach(function (address) {
                if (address.trim() !== '') { // check if the address is not empty
                    var lines = splitAddressIntoLines(address.trim());
                    var formattedMobile = lines[3].replace(/\s+/g, ''); // remove spaces from mobile number
                    lines[3] = formattedMobile ? 'Mobile: - ' + formattedMobile : ''; // set 4th line as "Mobile: -" with mobile number
                    var label = labelTemplate.replace('{{line1}}', capitalizeFirstLetter(lines[0]))
                        .replace('{{line2}}', capitalizeFirstLetter(lines[1] || ''))
                        .replace('{{line3}}', capitalizeFirstLetter(lines[2] || ''))
                        .replace('{{line4}}', capitalizeFirstLetter(lines[3] || ''));
                    labelContainer.innerHTML += label;
                    labelContainer.innerHTML += '<br>'; // Add line break between tables
                }
            });
        }


        function splitAddressIntoLines(address) {
            console.log("Address->", address);
            var lines = ['', '', '', ''];
            var words = address.split(' ');
            var currentLineIndex = 0;
            var mobileNoIndex = -1;
            words.forEach(function (word) {
                if (lines[currentLineIndex].length + word.length + 1 <= 30) {
                    lines[currentLineIndex] += word + ' ';
                } else {
                    currentLineIndex++;
                    if (currentLineIndex > 2) {
                        currentLineIndex = 2;
                    }
                    lines[currentLineIndex] += word + ' ';
                }
                if (word.includes(',')) {
                    lines[currentLineIndex] = lines[currentLineIndex].replace(/,/g, ', ');
                }
            });
            // Remove everything after pincode in line 3
            var pincodeRegex = /(?:\b|\D)\d(?:\s?\d){5}(?:\b|\D)/;
            var pincodeMatch = lines[2].match(pincodeRegex);
            var mobileNumberLine = lines[2];
            if (pincodeMatch) {
                lines[2] = lines[2].substring(0, pincodeMatch.index + pincodeMatch[0].length);
                var mobileNoMatch = mobileNumberLine.substring(pincodeMatch.index + pincodeMatch[0].length, mobileNumberLine.length);
                // var mobileNoMatch = extractMobileNumber(mobileNumberLine);
                lines[3] = mobileNoMatch.replace(/\D/g, "").trim();
                return lines;
            }
            return lines;
        }

        function capitalizeFirstLetter(string) {
            var words = string.split(' ');
            var capitalizedWords = words.map(function (word) {
                var capitalizedWord = word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                var dotIndex = capitalizedWord.indexOf('.');
                if (dotIndex !== -1 && dotIndex + 1 < capitalizedWord.length) {
                    capitalizedWord = capitalizedWord.slice(0, dotIndex + 1) + capitalizedWord.charAt(dotIndex + 1).toUpperCase() + capitalizedWord.slice(dotIndex + 2);
                }
                return capitalizedWord;
            });
            return capitalizedWords.join(' ');
        }

        function extractMobileNumber(str) {
            const regex = /^(?:Mob|Mobile).*?(\+?\d{2}-?\s?\d{10}|\d{10})/;
            const match = str.match(regex);
            if (match && match.length > 1) {
                return match[1].replace(/\D/g, ''); // Remove non-digit characters
            }
            return null; // Return null if no mobile number is found
        }


        function formatIndianAddress(address) {
            const regex = /^([A-Za-z.\s]+)\s*([a-z\s]+),\s*(\w+\s*\w*)\.\s*(.*?),\s*(.*?),\s*(.*?),\s*(.*?),\s*(\d{6})\s*mob[^\d]*(\d+)/i;
            const match = address.match(regex);
            if (!match) {
                return null;
            }
            const [_, title, name, designation, street, locality, city, state, pinCode, mobile] = match;
            const formattedAddress = `${title.trim()} ${name.trim()}, ${designation.trim()}\n${street.trim()},\n${locality.trim()},\n${city.trim()} - ${pinCode.trim()},\n${state.trim()}\nMobile: ${mobile.trim()}`;
            return formattedAddress;
        }


        function printLabels() {
            // Get mailing labels container
            var labelContainer = document.getElementById('label_container');

            // Create new window to display the mailing labels
            var printWindow = window.open('', '_blank');

            // Write mailing labels HTML to new window
            printWindow.document.write('<html><head><title>Mailing Labels</title>');
            printWindow.document.write('<style>body { margin: 0; }</style>');
            printWindow.document.write('</head><body>');
            printWindow.document.write(labelContainer.innerHTML);
            printWindow.document.write('</body></html>');

            // Wait for the window content to load before triggering print
            printWindow.document.addEventListener('DOMContentLoaded', function () {
                // Print the mailing labels
                setTimeout(function () {
                    printWindow.print();

                    // Close the new window after a short delay
                    setTimeout(function () {
                        printWindow.close();
                    }, 100);
                }, 100);
            });
        }


    </script>
</body>

</html>
