<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mailing Label Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;

            margin: 30px 0;
        }

        span:hover {
            background-color: #f5f5f5;
            color: #6c63ff;
            cursor: pointer;
        }

        form {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #666;
        }

        #label_container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            page-break-inside: avoid;
        }

        #search_results {
            padding: 10px;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 97%;
            display: none;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            vertical-align: top;
            border-radius: 10%;
        }

        @media only screen and (max-width: 768px) {
            form {
                padding: 20px;
            }

            textarea {
                margin-bottom: 10px;
            }
        }

        @media only screen and (max-width: 480px) {
            h1 {
                font-size: 28px;
                margin: 20px 0;
            }

            form {
                padding: 10px;
            }

            textarea {
                margin-bottom: 5px;
                font-size: 14px;
            }

            button {
                font-size: 16px;
            }

            #label_container {
                padding: 10px;
            }

            td {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <h1>Mailing Label Generator</h1>
    <!-- Update the search bar and content area with the new styles -->


    <!-- <button id="signout_button" onclick="handleSignoutClick()" visibility="hidden">Sign Out</button> -->

    <pre id="content" style="white-space: pre-wrap;"></pre>
    <form>
        <div id="search_container">
            <label for="search_input">Search Contact:</label>
            <input type="text" id="search_input" oninput="searchConnections()" placeholder="Search...">
            <div id="search_results"></div>
        </div>
        <label for="from_address" style="display: none;">From:</label>
        <textarea id="from_address" name="from_address" rows="3"
            style="display: none;">Udai Srivastava<br>Kumud Cottage, 503K/1R, Rajrooppur<br>Prayagraj-211011, Mobile: +91-9415267861</textarea>
        <br>
        <label for="to_addresses">To:</label>
        <textarea id="to_addresses" name="to_addresses" rows="10"></textarea>
        <br>
        <button type="button" onclick="generateLabels()">Generate Labels</button>
        <button type="button" onclick="printLabels()">Print Labels</button>
    </form>
    <br>
    <div id="label_container"></div>
    <script>

        function generateLabels() {
            // Get form inputs
            var fromAddress = document.getElementById('from_address').value;
            var toAddresses = document.getElementById('to_addresses').value;
            var addresses = toAddresses.split('_____');

            // Define mailing label template
            var labelTemplate = `
        <table style="border-collapse: collapse; width: 100%; page-break-inside: avoid;">
            <tr>
                <td style="text-align: center; font-size: 20px; font-weight: bold; border: 1px solid black; padding: 10px;">Vaibhav Law House</td>
            </tr>
            <tr>
                <td style="border: 1px solid black; padding: 10px;">
                    <div style="font-weight: bold;">Deliver To:</div>
                    <div>{{line1}}</div>
                    <div>{{line2}}</div>
                    <div>{{line3}}</div>
                    <div>{{line4}}</div>
                    <br>
                    <div style="font-weight: bold; text-align: right;">If undelivered return to:</div>
                    <div style="text-align: right;">${fromAddress}</div>
                </td>
            </tr>
        </table>
    `;

            // Generate mailing labels and display them
            var labelContainer = document.getElementById('label_container');
            labelContainer.innerHTML = '';
            addresses.forEach(function (address) {
                if (address.trim() !== '' && address.trim() !== '_____') { // check if the address is not empty
                    var lines = splitAddressIntoLines(address.trim());
                    var formattedMobile = lines[3].replace(/\s+/g, ''); // remove spaces from mobile number
                    lines[3] = formattedMobile ? 'Mobile: - ' + formattedMobile : ''; // set 4th line as "Mobile: -" with mobile number
                    var label = labelTemplate.replace('{{line1}}', capitalizeFirstLetter(lines[0]))
                        .replace('{{line2}}', capitalizeFirstLetter(lines[1] || ''))
                        .replace('{{line3}}', capitalizeFirstLetter(lines[2] || ''))
                        .replace('{{line4}}', capitalizeFirstLetter(lines[3] || ''));
                    labelContainer.innerHTML += label;
                    labelContainer.innerHTML += '<br>'; // Add line break between tables
                }
            });
        }


        function splitAddressIntoLines(address) {
            console.log("Address->", address);
            var lines = ['', '', '', ''];
            var words = address.split(' ');
            var currentLineIndex = 0;
            var mobileNoIndex = -1;
            words.forEach(function (word) {
                if (lines[currentLineIndex].length + word.length + 1 <= 30) {
                    lines[currentLineIndex] += word + ' ';
                } else {
                    currentLineIndex++;
                    if (currentLineIndex > 2) {
                        currentLineIndex = 2;
                    }
                    lines[currentLineIndex] += word + ' ';
                }
                if (word.includes(',')) {
                    lines[currentLineIndex] = lines[currentLineIndex].replace(/,/g, ', ');
                }
            });
            // Remove everything after pincode in line 3
            var pincodeRegex = /(?:\b|\D)\d(?:\s?\d){5}(?:\b|\D)/;
            var pincodeMatch = lines[2].match(pincodeRegex);
            var mobileNumberLine = lines[2];
            if (pincodeMatch) {
                lines[2] = lines[2].substring(0, pincodeMatch.index + pincodeMatch[0].length);
                var mobileNoMatch = mobileNumberLine.substring(pincodeMatch.index + pincodeMatch[0].length, mobileNumberLine.length);
                // var mobileNoMatch = extractMobileNumber(mobileNumberLine);
                lines[3] = mobileNoMatch.replace(/\D/g, "").trim();
                return lines;
            }
            return lines;
        }

        function capitalizeFirstLetter(string) {
            var words = string.split(' ');
            var capitalizedWords = words.map(function (word) {
                var capitalizedWord = word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                var dotIndex = capitalizedWord.indexOf('.');
                if (dotIndex !== -1 && dotIndex + 1 < capitalizedWord.length) {
                    capitalizedWord = capitalizedWord.slice(0, dotIndex + 1) + capitalizedWord.charAt(dotIndex + 1).toUpperCase() + capitalizedWord.slice(dotIndex + 2);
                }
                return capitalizedWord;
            });
            return capitalizedWords.join(' ');
        }

        function extractMobileNumber(str) {
            const regex = /^(?:Mob|Mobile).*?(\+?\d{2}-?\s?\d{10}|\d{10})/;
            const match = str.match(regex);
            if (match && match.length > 1) {
                return match[1].replace(/\D/g, ''); // Remove non-digit characters
            }
            return null; // Return null if no mobile number is found
        }


        function formatIndianAddress(address) {
            const regex = /^([A-Za-z.\s]+)\s*([a-z\s]+),\s*(\w+\s*\w*)\.\s*(.*?),\s*(.*?),\s*(.*?),\s*(.*?),\s*(\d{6})\s*mob[^\d]*(\d+)/i;
            const match = address.match(regex);
            if (!match) {
                return null;
            }
            const [_, title, name, designation, street, locality, city, state, pinCode, mobile] = match;
            const formattedAddress = `${title.trim()} ${name.trim()}, ${designation.trim()}\n${street.trim()},\n${locality.trim()},\n${city.trim()} - ${pinCode.trim()},\n${state.trim()}\nMobile: ${mobile.trim()}`;
            return formattedAddress;
        }



        function printLabels() {
            // Get mailing labels container
            var labelContainer = document.getElementById('label_container');

            // Create a new tab
            var printWindow = window.open('', '_blank');

            // Write mailing labels HTML to new tab
            printWindow.document.write('<html><head><title>Mailing Labels</title>');
            printWindow.document.write('</head><body>');
            printWindow.document.write(labelContainer.innerHTML);
            printWindow.document.write('</body></html>');

            // Inject print button and styles into the new tab
            var styles = `

      .print-button {

        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;

      }

            var printButton = '<button class="print-button" onclick="window.print()">Print</button>';
            printWindow.document.head.insertAdjacentHTML('beforeend', styles);
            printWindow.document.body.insertAdjacentHTML('beforeend', printButton);

            // Close the document to prevent overwriting
            function printLabels() {
                // Get mailing labels container
                var labelContainer = document.getElementById('label_container');

                // Create a new tab
                var printWindow = window.open('', '_blank');

                // Write mailing labels HTML to new tab
                printWindow.document.write('<html><head><title>Mailing Labels</title>');
                printWindow.document.write('</head><body>');
                printWindow.document.write(labelContainer.innerHTML);
                printWindow.document.write('</body></html>');

                // Inject print button and styles into the new tab
                var styles = `
    <style>
      .print-button {
        margin: 20px;
        padding: 10px 20px;
        font-size: 18px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .print-button:hover {
        background-color: #45a049;
      }
    </style>
  `;
                var printButton = '<button class="print-button" onclick="window.print()">Print</button>';
                printWindow.document.head.insertAdjacentHTML('beforeend', styles);
                printWindow.document.body.insertAdjacentHTML('beforeend', printButton);

                // Close the document to prevent overwriting

                function printLabels() {
                    // Get mailing labels container
                    var labelContainer = document.getElementById('label_container');

                    // Create a new tab
                    var printWindow = window.open('', '_blank');

                    // Write mailing labels HTML to new tab
                    printWindow.document.write('<html><head><title>Mailing Labels</title>');
                    printWindow.document.write('</head><body>');
                    printWindow.document.write(labelContainer.innerHTML);
                    printWindow.document.write('</body></html>');

                    // Inject print button and styles into the new tab
                    var styles = `
    <style>
      .print-button {
        margin: 20px;
        padding: 10px 20px;
        font-size: 18px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .print-button:hover {
        background-color: #45a049;
      }
    </style>
  `;
                    var printButton = '<button class="print-button" onclick="window.print()">Print</button>';
                    printWindow.document.head.insertAdjacentHTML('beforeend', styles);
                    printWindow.document.body.insertAdjacentHTML('beforeend', printButton);

                    // Close the document to prevent overwriting
                    printWindow.document.close();
                }
            }
        };


        // Fetching Contacts code from below
        /* exported gapiLoaded */
        /* exported gisLoaded */
        /* exported handleAuthClick */
        /* exported handleSignoutClick */

        // TODO: Set your client ID and API key from the Google Developer Console
        const CLIENT_ID = '509563891606-7e8onpesfmdop1ne2mc2enhm76nbqqhi.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyCwgToPvB9luZ0poJ0cDZLArydQM_zGQdI';

        // Discovery doc URL for APIs used by the quickstart
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/people/v1/rest';

        // Authorization scopes required by the API; multiple scopes can be included, separated by spaces.
        const SCOPES = 'https://www.googleapis.com/auth/contacts.readonly';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        let connectionsSearch = []; // Global variable for connections

        function searchConnections() {
            const inputValue = document.getElementById('search_input').value.trim().toLowerCase();
            const matchingConnections = [];

            if (inputValue.length >= 3) {
                const filteredConnections = connectionsSearch.filter((connection) => {
                    return (
                        (connection.name && connection.name.toLowerCase().includes(inputValue)) ||
                        (connection.address && connection.address.toLowerCase().includes(inputValue))
                    );
                });

                matchingConnections.push(...filteredConnections);
            }

            displayConnections(matchingConnections);
        }

        /**
         * Display the connections in the content area.
         * @param {Array} connections - Array of connections to display.
         */
        function displayConnections(connections) {
            let output = '';
            connections.forEach((contact) => {
                if (contact.name && contact.address) {
                    output += `<span class="connection"  style="display:block; height: 25px" data-name="${contact.name}" data-address="${contact.address}">${contact.name} - ${contact.address}</span>\n`;
                } else if (contact.name) {
                    output += `<span class="connection" style="display:block; height: 25px" data-name="${contact.name}">${contact.name}</span>\n`;
                } else if (contact.address) {
                    output += `<span class="connection" style="display:block; height: 25px" data-address="${contact.address}">${contact.address}</span>\n`;
                }
            });

            const searchResultsContainer = document.getElementById('search_results');
            if (connections.length > 0) {
                searchResultsContainer.style.display = 'block';
                searchResultsContainer.innerHTML = output;
            } else {
                searchResultsContainer.style.display = 'none';
                searchResultsContainer.innerHTML = '';
            }

            // Add event listeners for selecting a connection
            const connectionElements = document.getElementsByClassName('connection');
            Array.from(connectionElements).forEach((element) => {
                element.addEventListener('click', function (event) {
                    console.log("Event--->",event);
                    const selectedName = event.target.dataset.name;
                    const selectedAddress = event.target.dataset.address;
                    if (selectedName + selectedAddress) {
                        const existingAddressLabel = document.getElementById('to_addresses').value;
                        const toAddressesLabel = `${selectedName} ${selectedAddress}>_____${existingAddressLabel}`;
                        document.getElementById('to_addresses').innerText = toAddressesLabel;
                        console.log('Selected Name:', toAddressesLabel);
                        console.log('Selected Address:', selectedAddress);
                    }
                });
            });
        }

        // document.getElementById('signout_button').style.visibility = 'hidden';

        /**
         * Callback after api.js is loaded.
         */
        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        /**
         * Callback after the API client is loaded. Loads the discovery doc to initialize the API.
         */
        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
            maybeEnableButtons();

            // Call the handleAuthClick function on page load to authorize the user
            await handleAuthClick();
        }

        /**
         * Callback after Google Identity Services are loaded.
         */
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // defined later
            });
            gisInited = true;
            maybeEnableButtons();
        }

        /**
         * Enables user interaction after all libraries are loaded.
         */
        function maybeEnableButtons() {
            if (gapiInited && gisInited) {
                // document.getElementById('signout_button').style.visibility = 'visible';
            }
        }

        /**
         * Sign out the user upon button click.
         */
        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                document.getElementById('content').innerText = '';
                document.getElementById('signout_button').style.visibility = 'hidden';
            }
        }

        /**
         * Authorize the user and fetch connection names.
         */
        function handleAuthClick() {
            tokenClient.callback = async function (resp) {
                if (resp.error !== undefined) {
                    console.error('Authorization error:', resp.error);
                    return;
                }

                // document.getElementById('signout_button').style.visibility = 'visible';
                await listConnectionNames();
                console.log('Access Token:--->', gapi.client.getToken().access_token);
            };
            const localAccessToken = localStorage.getItem('accessToken');
            if (localAccessToken !== gapi.client.getToken()) {
                // Prompt the user to select a Google Account and ask for consent to share their data
                // when establishing a new session.
                const accessToken = gapi.client.getToken().access_token;
                localStorage.setItem('accessToken', accessToken);
                tokenClient.requestAccessToken({ prompt: 'consent', login_hint: '' });
            } else {
                // Skip display of account chooser and consent dialog for an existing session.
                tokenClient.requestAccessToken({ prompt: '', login_hint: '' });
            }
        }


        /**
         * Fetch and display the list of connection names.
         */
        async function listConnectionNames() {
            let response;
            try {
                response = await gapi.client.people.people.connections.list({
                    'resourceName': 'people/me',
                    'pageSize': 2000,
                    'personFields': 'names,emailAddresses,addresses',
                });
            } catch (err) {
                console.error('Error fetching connection names:', err);
                return;
            }

            const connections = response.result.connections;
            if (!connections || connections.length === 0) {
                document.getElementById('content').innerText = 'No connections found.';
                return;
            }

            // Extract names and addresses from connections
            const connectionsData = connections.map((person) => {
                const name = person.names && person.names[0] && person.names[0].displayName;
                const address = person.addresses && person.addresses[0] && person.addresses[0].formattedValue;
                return { name, address };
            });


            // Sort the contacts by name
            connectionsData.sort((a, b) => {
                if (a.name && b.name) {
                    return a.name.localeCompare(b.name);
                } else if (a.name) {
                    return -1;
                } else if (b.name) {
                    return 1;
                }
                return 0;
            });

            // Store connections in the global variable
            connectionsSearch = connectionsData;

            // Display the connections
            displayConnections(connections);
        }


    </script>
