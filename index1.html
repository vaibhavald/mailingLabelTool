<!DOCTYPE html>
<html>

<head>
    <title>People API Quickstart</title>
    <meta charset="utf-8" />

    <style>
        /* CSS styles for the search bar and content area */
        #search_container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        #search_input {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: none;
            outline: none;
            width: 300px;
            margin-bottom: 8px;
        }

        #search_input:focus {
            border-color: #6c63ff;
        }

        #search_results {
            padding: 8px;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 300px;
            display: none;
        }

        #search_results .connection {
            display: block;
            cursor: pointer;
            margin-bottom: 4px;
        }
    </style>


</head>

<body>
    <p>People API Quickstart</p>

    <!-- Update the search bar and content area with the new styles -->
    <div id="search_container">
        <input type="text" id="search_input" oninput="searchConnections()" placeholder="Search...">
        <div id="search_results"></div>
    </div>

    <button id="signout_button" onclick="handleSignoutClick()">Sign Out</button>

    <pre id="content" style="white-space: pre-wrap;"></pre>


    <script type="text/javascript">
        /* exported gapiLoaded */
        /* exported gisLoaded */
        /* exported handleAuthClick */
        /* exported handleSignoutClick */

        // TODO(developer): Set to client ID and API key from the Developer Console

        const CLIENT_ID = '509563891606-7e8onpesfmdop1ne2mc2enhm76nbqqhi.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyCwgToPvB9luZ0poJ0cDZLArydQM_zGQdI';

        // Discovery doc URL for APIs used by the quickstart
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/people/v1/rest';

        // Authorization scopes required by the API; multiple scopes can be
        // included, separated by spaces.
        const SCOPES = 'https://www.googleapis.com/auth/contacts.readonly';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        let connectionsSearch = []; // Global variable for connections

        function searchConnections() {
            const inputValue = document.getElementById('search_input').value.trim().toLowerCase();
            const matchingConnections = [];

            if (inputValue.length >= 3) {
                const filteredConnections = connectionsSearch.filter((connection) => {
                    return (
                        (connection.name && connection.name.toLowerCase().includes(inputValue)) ||
                        (connection.address && connection.address.toLowerCase().includes(inputValue))
                    );
                });

                matchingConnections.push(...filteredConnections);
            }

            displayConnections(matchingConnections);
        }

        /**
      * Display the connections in the content area.
      * @param {Array} connections - Array of connections to display.
      */
        function displayConnections(connections) {
            let output = '';
            connections.forEach((contact) => {
                if (contact.name && contact.address) {
                    output += `<span class="connection" data-name="${contact.name}" data-address="${contact.address}">${contact.name} - ${contact.address}</span>\n`;
                } else if (contact.name) {
                    output += `<span class="connection" data-name="${contact.name}">${contact.name}</span>\n`;
                } else if (contact.address) {
                    output += `<span class="connection" data-address="${contact.address}">${contact.address}</span>\n`;
                }
            });

            const searchResultsContainer = document.getElementById('search_results');
            if (connections.length > 0) {
                searchResultsContainer.style.display = 'block';
                searchResultsContainer.innerHTML = output;
            } else {
                searchResultsContainer.style.display = 'none';
                searchResultsContainer.innerHTML = '';
            }

            // Add event listeners for selecting a connection
            const connectionElements = document.getElementsByClassName('connection');
            Array.from(connectionElements).forEach((element) => {
                element.addEventListener('click', function (event) {
                    const selectedName = event.target.dataset.name;
                    const selectedAddress = event.target.dataset.address;
                    if (selectedName && selectedAddress) {
                        console.log('Selected Name:', selectedName);
                        console.log('Selected Address:', selectedAddress);
                    }
                });
            });
        }


        document.getElementById('signout_button').style.visibility = 'hidden';

        /**
         * Callback after api.js is loaded.
         */
        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        /**
         * Callback after the API client is loaded. Loads the
         * discovery doc to initialize the API.
         */
        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
            maybeEnableButtons();

            // Call the handleAuthClick function on page load to authorize the user
            await handleAuthClick();
        }

        /**
         * Callback after Google Identity Services are loaded.
         */
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // defined later
            });
            gisInited = true;
            maybeEnableButtons();
        }

        /**
         * Enables user interaction after all libraries are loaded.
         */
        function maybeEnableButtons() {
            if (gapiInited && gisInited) {
                document.getElementById('signout_button').style.visibility = 'visible';
            }
        }

        /**
         *  Sign out the user upon button click.
         */
        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                document.getElementById('content').innerText = '';
                document.getElementById('signout_button').style.visibility = 'hidden';
            }
        }

        /**
         *  Authorize the user and fetch connection names.
         */
        /**
 * Sign in the user upon button click.
 */
        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    throw resp;
                }
                document.getElementById('signout_button').style.visibility = 'visible';
                await listConnectionNames();
            };

            if (gapi.client.getToken() === null) {
                // Prompt the user to select a Google Account and ask for consent to share their data
                // when establishing a new session.
                tokenClient.requestAccessToken({ prompt: 'none' });
            } else {
                // Skip display of account chooser and consent dialog for an existing session.
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }


        /**
         * Print the display name if available for 10 connections.
         */
        /**
 * Print the display name if available for all connections in sorted order.
 */
        /**
 * Print the name and address if available for all connections in sorted order.
 */
        /**
 * Print the display name if available for all connections in sorted order.
 */
        async function listConnectionNames() {
            let response;
            try {
                response = await gapi.client.people.people.connections.list({
                    'resourceName': 'people/me',
                    'pageSize': 2000,
                    'personFields': 'names,emailAddresses,addresses',
                });
            } catch (err) {
                document.getElementById('content').innerText = err.message;
                return;
            }
            const connections = response.result.connections;
            if (!connections || connections.length == 0) {
                document.getElementById('content').innerText = 'No connections found.';
                return;
            }

            // Extract names and addresses from connections
            connectionsData = connections.map((person) => {
                const name = person.names && person.names[0] && person.names[0].displayName;
                const address = person.addresses && person.addresses[0] && person.addresses[0].formattedValue;
                return { name, address };
            });

            // Sort the contacts by name
            connectionsData.sort((a, b) => {
                if (a.name && b.name) {
                    return a.name.localeCompare(b.name);
                } else if (a.name) {
                    return -1;
                } else if (b.name) {
                    return 1;
                }
                return 0;
            });

            // Store connections in the global variable
            connectionsSearch = connectionsData;

            // Display the connections
            displayConnections(connections);


            // Add event listener for selecting a connection
            // const content = document.getElementById('content');
            // console.log("content", content);
            // content.addEventListener('click', function (event) {
            //     const selectedName = event.target.dataset.name;
            //     const selectedAddress = event.target.dataset.address;
            //     if (selectedName && selectedAddress) {
            //         console.log('Selected Name:', selectedName);
            //         console.log('Selected Address:', selectedAddress);
            //     }
            // });
        }



    </script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>

</html>
